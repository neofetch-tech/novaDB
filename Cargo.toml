[package]
name = "novadb-core"
version = "0.1.0"
edition = "2024"
description = "Core schema, SQL, migration and fake-data engine for NovaDB"

[lib]
name = "novadb_core"
path = "src/lib.rs"

[dependencies]
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["webview2-com"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

thiserror = "2"
serde_json = "1"
